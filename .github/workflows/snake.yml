name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"  # runs once per day at midnight UTC
  workflow_dispatch:        # allow manual trigger
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
          git_push_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to output branch
        run: |
          git checkout --orphan output
          git --git-dir=.git config user.name "github-actions[bot]"
          git --git-dir=.git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p output
          cp -r dist/* output/
          git add output/
          git commit -m "snake: regenerate contribution graph"
          git push origin HEAD:output --force
